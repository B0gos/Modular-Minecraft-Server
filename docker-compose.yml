services:
  velocity:
    build: alpine-velocity/
    restart: unless-stopped
    ports:
      - "25565:25565/tcp"
    networks:
      default:
      minecraft:
        ipv4_address: 14.0.0.2
        
  geyser:
    build: alpine-geyser/
    restart: unless-stopped
    ports:
      - "19132:19132/udp"
    networks:
      default:
      minecraft:
        ipv4_address: 14.0.0.25
        
  hub:
    build: alpine-paper-hub/.
    restart: unless-stopped
    networks:
      minecraft:
        ipv4_address: 14.0.0.3
        
  modpack:
    build: alpine-sponge-modpack/.
    restart: unless-stopped
    networks:
      minecraft:
        ipv4_address: 14.0.0.11


networks:
  minecraft:
    ipam:
      driver: default
      config:
        - subnet: "14.0.0.0/24"
